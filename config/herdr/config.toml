onboarding = false

[keys]
zoom = "prefix+z"
cycle_pane_next = "prefix+o"
open_notification_target = "prefix+shift+o"

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "vim-herdr-navigation.left"
description = "navigate left (vim/herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "vim-herdr-navigation.down"
description = "navigate down (vim/herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "vim-herdr-navigation.up"
description = "navigate up (vim/herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "vim-herdr-navigation.right"
description = "navigate right (vim/herdr)"

[[keys.command]]
key = "cmd+r"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"
description = "toggle code-review sidebar"

[ui]
show_agent_labels_on_pane_borders = true

agent_panel_sort = "priority"
[theme]
name = "gruvbox"
auto_switch = false

[ui.toast]
delivery = "terminal"

[ui.sound]
enabled = false
